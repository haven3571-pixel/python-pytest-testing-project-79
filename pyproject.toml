[project]
name = "hexlet-code"
version = "0.1.0"
description = "Page loader library and command-line utility"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bs4>=0.0.2",
    "pytest>=9.2.0",
    "requests>=2.31.0",
]

[project.scripts]
page-loader = "page_loader.scripts.page_loader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["page_loader"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "requests-mock>=1.11.0",
    "flake8>=7.0.0",
]
